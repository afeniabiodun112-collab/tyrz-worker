name: TYRZ Digests

# Free scheduler: GitHub Actions cron pings the server's digest endpoints.
# The server does the actual work (pull stats, send email/Gmail/Telegram).
on:
  schedule:
    # Daily digest — 08:07 UTC (odd minute to avoid the top-of-hour stampede).
    - cron: '7 8 * * *'
    # Weekly digest — Sundays 09:07 UTC.
    - cron: '7 9 * * 0'
  workflow_dispatch:
    inputs:
      period:
        description: 'daily or weekly'
        default: 'daily'

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Fire digest
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          CRON_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          # Decide period: weekly only on the Sunday 09:07 schedule; else daily.
          PERIOD="${{ github.event.inputs.period }}"
          if [ -z "$PERIOD" ]; then
            if [ "${{ github.event.schedule }}" = "7 9 * * 0" ]; then PERIOD="weekly"; else PERIOD="daily"; fi
          fi
          echo "Firing $PERIOD digest"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            "$SERVER_URL/cron/$PERIOD")
          echo "HTTP $code"
          test "$code" = "200"
